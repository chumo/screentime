name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ScreenTime.sln

      - name: Build solution
        run: dotnet build ScreenTime.sln --configuration Release --no-restore

      - name: Publish Service
        run: dotnet publish src/ScreenTime.Service/ScreenTime.Service.csproj -c Release -r win-x64 --self-contained -o publish/Service

      - name: Publish LockScreen
        run: dotnet publish src/ScreenTime.LockScreen/ScreenTime.LockScreen.csproj -c Release -r win-x64 --self-contained -o publish/LockScreen

      - name: Publish Config
        run: dotnet publish src/ScreenTime.Config/ScreenTime.Config.csproj -c Release -r win-x64 --self-contained -o publish/Config

      - name: Create installer package
        run: |
          Compress-Archive -Path publish\Service, publish\LockScreen, publish\Config -DestinationPath ScreenTime-Portable.zip
        shell: pwsh

      - name: Generate install script
        run: |
          @'
          @echo off
          echo Installing ScreenTime...
          echo.
          net session >nul 2>&1
          if %errorlevel% neq 0 (
              echo ERROR: Please run this script as Administrator.
              pause
              exit /b 1
          )
          set INSTALLDIR=%ProgramFiles%\ScreenTime
          mkdir "%INSTALLDIR%\Service" 2>nul
          mkdir "%INSTALLDIR%\LockScreen" 2>nul
          mkdir "%INSTALLDIR%\Config" 2>nul
          xcopy /s /y "Service\*" "%INSTALLDIR%\Service\"
          xcopy /s /y "LockScreen\*" "%INSTALLDIR%\LockScreen\"
          xcopy /s /y "Config\*" "%INSTALLDIR%\Config\"
          echo Registering service...
          sc create ScreenTimeService binPath="%INSTALLDIR%\Service\ScreenTime.Service.exe" start=auto
          sc start ScreenTimeService
          echo Creating Start Menu shortcut...
          powershell -Command "$ws = New-Object -ComObject WScript.Shell; $s = $ws.CreateShortcut('%ProgramData%\Microsoft\Windows\Start Menu\Programs\ScreenTime Config.lnk'); $s.TargetPath = '%INSTALLDIR%\Config\ScreenTime.Config.exe'; $s.WorkingDirectory = '%INSTALLDIR%\Config'; $s.Save()"
          echo.
          echo Installation complete!
          echo Run "ScreenTime Config" from the Start Menu to configure.
          pause
          '@ | Out-File -FilePath publish\install.bat -Encoding ASCII
          @'
          @echo off
          echo Uninstalling ScreenTime...
          net session >nul 2>&1
          if %errorlevel% neq 0 (
              echo ERROR: Please run this script as Administrator.
              pause
              exit /b 1
          )
          sc stop ScreenTimeService 2>nul
          sc delete ScreenTimeService 2>nul
          rmdir /s /q "%ProgramFiles%\ScreenTime" 2>nul
          del "%ProgramData%\Microsoft\Windows\Start Menu\Programs\ScreenTime Config.lnk" 2>nul
          echo Uninstallation complete.
          echo Note: Configuration data remains in %ProgramData%\ScreenTime
          pause
          '@ | Out-File -FilePath publish\uninstall.bat -Encoding ASCII
        shell: pwsh

      - name: Create release archive
        run: |
          Compress-Archive -Path publish\Service, publish\LockScreen, publish\Config, publish\install.bat, publish\uninstall.bat -DestinationPath ScreenTime.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTime
          path: ScreenTime.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ScreenTime.zip
